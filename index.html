<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#FAF9F6">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#161616">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Étude">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <title>Étude</title>
    <link rel="icon" type="image/png" href="etude_favicon.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- KaTeX for LaTeX rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <style>
        :root {
            --bg-color: #FAF9F6;
            --text-color: #1a1a1a;
            --accent-color: #8DA399;
            --accent-light: #DCE6E0;
            --error-color: #C5AFA0;
            --error-light: #F2EBE6;
            --border-color: #dcdcdc;
            --surface-color: #fff;
            --overlay-color: rgba(250, 249, 246, 0.95);
            --muted-color: #666;
            --operator-color: #555;
            --quiet-color: #999;
            --slider-color: #ddd;
            --button-ink: #fff;
            --knob-color: #fff;
            --accent-hover: #7a9199;
            --accent-active: #6a8189;
            --border-soft: rgba(0,0,0,0.05);
            --border-strong: rgba(0,0,0,0.1);
            --header-dot: rgba(0,0,0,0.15);
            --ui-font: 'Lato', sans-serif;
            --math-font: 'Libre Baskerville', serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--ui-font);
            height: 100dvh;
            padding-bottom: env(safe-area-inset-bottom);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background-color 0.4s ease;
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
        }

        body.success-flash { background-color: var(--accent-light); }
        body.error-flash { background-color: var(--error-light); }

        /* --- Header (Grid Layout) --- */
        header {
            padding: calc(1.5rem + env(safe-area-inset-top)) calc(2rem + env(safe-area-inset-right)) 1.5rem calc(2rem + env(safe-area-inset-left));
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            border-bottom: none;
            background-image: radial-gradient(circle, var(--header-dot) 1.4px, transparent 1.4px);
            background-size: 11.2px 2.8px;
            background-position: 0 bottom;
            background-repeat: repeat-x;
            padding-bottom: calc(1.5rem + 2.8px);
            position: relative;
            z-index: 10;
        }

        h1 {
            font-family: var(--math-font);
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-align: center;
            grid-column: 2;
        }

        /* --- Menu Button (Left) --- */
        .header-left { grid-column: 1; justify-self: start; }

        .menu-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            color: var(--text-color);
            opacity: 0.6;
            transition: opacity 0.2s;
            display: flex;
            align-items: center;
        }
        .menu-btn:hover { opacity: 1; }
        .menu-icon { width: 24px; height: 24px; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }

        /* --- Streak (Right) --- */
        .header-right { grid-column: 3; justify-self: end; display: flex; align-items: center; }

        .streak-wrapper { 
            display: flex; 
            flex-direction: column; 
            align-items: flex-end; 
            gap: 4px; 
            /* Hidden by default, fades in/out */
            opacity: 0;
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            cursor: pointer;
        }
        .streak-wrapper.visible { opacity: 1; }

        .streak-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1.5px; opacity: 0.5; font-weight: 700; }
        .streak-container { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; min-height: 30px; }
        .streak-digits { 
            font-family: var(--math-font); 
            font-size: 1.2rem; 
            font-weight: 700; 
            color: var(--text-color);
            line-height: 1;
            min-height: 30px;
            align-items: center;
            justify-content: center;
        }

        /* Streak Dropdown Menu */
        .streak-dropdown {
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 8px;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-shadow: 0 4px 12px var(--border-strong);
            min-width: 182px;
            opacity: 0;
            pointer-events: none;
            transform: translateY(-5px);
            transition: opacity 0.2s ease, transform 0.2s ease;
            z-index: 50;
        }
        .streak-dropdown.open {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }
        .streak-dropdown-header {
            padding: 0.6rem 1rem;
            font-family: var(--math-font);
            font-size: 0.7rem;
            color: var(--text-color);
            font-weight: 700;
            border-bottom: 1px solid var(--border-strong);
        }
        .streak-dropdown-item {
            padding: 0.6rem 1rem;
            font-family: var(--ui-font);
            font-size: 0.85rem;
            color: var(--muted-color);
            cursor: pointer;
            transition: background-color 0.2s;
            border-bottom: 1px solid var(--border-soft);
        }
        .streak-dropdown-item[data-mode="fancy"] {
            border-bottom: none;
        }
        .streak-dropdown-item:hover {
            background-color: var(--bg-color);
        }
        .streak-dropdown-item.active {
            background-color: var(--accent-light);
            color: var(--accent-color);
            font-weight: 600;
        }
        
        /* Fractal Grid */
        .f-grid { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); width: 100%; height: 100%; gap: 10%; }
        .f-item { width: 100%; height: 100%; background-color: var(--text-color); border-radius: 1px; }
        .f-full { background-color: var(--text-color); opacity: 0.85; }
        .f-atom { background-color: var(--text-color); }

        /* --- Modal (Menu) --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--overlay-color);
            backdrop-filter: blur(5px);
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 10vh;
        }
        .modal-overlay.open { opacity: 1; pointer-events: auto; }

        .modal-content {
            width: 90%;
            max-width: 400px;
            background: var(--surface-color);
            padding: 2rem;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px var(--border-soft);
            border-radius: 8px;
            transform: translateY(10px);
            transition: transform 0.3s ease;
        }
        .modal-overlay.open .modal-content { transform: translateY(0); }

        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        .modal-title { font-family: var(--math-font); font-size: 1.2rem; font-weight: 700; }
        .close-btn { color: var(--text-color); background: none; border: none; cursor: pointer; font-size: 1.5rem; line-height: 1; opacity: 0.5; }

        /* Blitz Termination Modal */
        .blitz-terminate-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--overlay-color);
            backdrop-filter: blur(5px);
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .blitz-terminate-modal.open { opacity: 1; pointer-events: auto; }

        .blitz-terminate-content {
            width: 90%;
            max-width: 350px;
            background: var(--surface-color);
            padding: 2rem;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px var(--border-soft);
            border-radius: 8px;
            transform: translateY(10px);
            transition: transform 0.3s ease;
            text-align: center;
        }
        .blitz-terminate-modal.open .blitz-terminate-content { transform: translateY(0); }

        .blitz-terminate-title {
            font-family: var(--math-font);
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .blitz-terminate-message {
            font-family: var(--ui-font);
            font-size: 0.95rem;
            color: var(--muted-color);
            margin-bottom: 1.5rem;
        }

        .blitz-terminate-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        .blitz-terminate-btn {
            padding: 0.6rem 1.5rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-family: var(--ui-font);
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--surface-color);
            color: var(--text-color);
        }

        .blitz-terminate-btn:hover {
            border-color: var(--text-color);
            background: var(--bg-color);
        }

        .blitz-terminate-btn.confirm {
            background: var(--accent-color);
            color: var(--button-ink);
            border-color: var(--accent-color);
        }

        .blitz-terminate-btn.confirm:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
        }
        
        /* Bulk Controls */
        .bulk-controls {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
            margin-bottom: 0.5rem;
            padding-top: 1rem;
            padding-bottom: 0.5rem;
            border-top: 1px solid var(--border-soft);
        }
        .bulk-btn {
            background: none;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 0.4rem 0.8rem;
            font-family: var(--ui-font);
            font-size: 0.8rem;
            cursor: pointer;
            color: var(--muted-color);
            transition: all 0.2s;
        }
        .bulk-btn:hover { border-color: var(--text-color); color: var(--text-color); }

        .toggles-list { display: flex; flex-direction: column; gap: 1rem; }
        .toggle-item { display: flex; justify-content: space-between; align-items: center; }
        .toggle-label { font-size: 0.95rem; }

        /* Switch CSS */
        .switch { position: relative; display: inline-block; width: 40px; height: 22px; -webkit-tap-highlight-color: transparent; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--slider-color); transition: .4s; border-radius: 22px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: var(--knob-color); transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--accent-color); }
        input:checked + .slider:before { transform: translateX(18px); }

        /* --- Main Game Area --- */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding-top: 3vh;
        }

        .question-container {
            position: relative;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 4rem;
        }

        #question-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        .solution-display {
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%) translateY(-10px);
            font-family: var(--math-font);
            font-size: 1.8rem;
            font-weight: 400;
            color: var(--accent-color);
            text-align: center;
            opacity: 0;
            transition: opacity 0.4s ease, transform 0.4s ease;
            pointer-events: none;
            white-space: nowrap;
        }
        .solution-display.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .question-part {
            font-family: var(--math-font);
            font-size: 3.5rem;
            font-weight: 400;
            line-height: 1;
            color: var(--text-color);
            font-variant-numeric: lining-nums;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .question-part.long-text { font-size: 2.2rem; letter-spacing: 2px; }
        .question-part.empty-state { font-size: 1.5rem; font-family: var(--ui-font); opacity: 0.5; }
        
        /* KaTeX styling for inline math */
        .katex-inline {
            display: inline-block;
        }
        .katex {
            font-size: inherit !important;
        }
        .katex .base {
            font-size: inherit !important;
        }

        .question-part.operator {
            font-size: 2.8rem; 
            color: var(--operator-color);
            transform: translateY(-2px);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), color 0.3s ease;
        }
        .question-part.operator.text-op { font-size: 2.2rem; margin: 0 1.4rem; font-style: italic; }
        sup { font-size: 0.6em; vertical-align: super; }

        .input-container { 
            position: relative; 
            width: 200px; 
            margin: 0 auto;
        }
        input[type="text"] {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 2px solid var(--text-color);
            font-family: var(--math-font);
            font-size: 2rem;
            text-align: center;
            color: var(--text-color);
            padding: 0.5rem;
            outline: none;
            border-radius: 0;
            caret-color: var(--accent-color);
        }

        /* Mobile Enter Button */
        .mobile-enter-btn {
            display: none;
            position: absolute;
            right: -54px;
            top: 50%;
            transform: translateY(-50%);
            width: 44px;
            height: 44px;
            background: var(--accent-color);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            padding: 0;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s ease, background-color 0.2s;
            opacity: 0;
            pointer-events: none;
            -webkit-tap-highlight-color: transparent;
        }
        .mobile-enter-btn.visible {
            opacity: 1;
            pointer-events: auto;
        }
        .mobile-enter-btn:active {
            background: var(--accent-active);
        }
        .mobile-enter-btn svg {
            width: 24px;
            height: 24px;
            stroke: var(--button-ink);
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        /* Show button only on mobile */
        @media (max-width: 768px) {
            .mobile-enter-btn {
                display: flex;
            }
        }

        .feedback-msg {
            height: 1.5rem;
            margin-top: 1rem;
            font-family: var(--ui-font);
            font-size: 0.9rem;
            color: var(--error-color);
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.2s;
        }

        /* Blitz Timer */
        .blitz-timer-placeholder {
            height: 100px;
            position: relative;
        }

        .blitz-timer-container {
            width: 67.5px;
            height: 67.5px;
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .blitz-timer-container.active {
            opacity: 1;
            pointer-events: auto;
            cursor: pointer;
        }

        .blitz-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            width: 100%;
            height: 100%;
            gap: 6px;
        }

        .blitz-square {
            background-color: var(--accent-color);
            border-radius: 4px;
            opacity: 1;
            transition: opacity 0.3s ease;
        }
        .blitz-square.faded { opacity: 0.2; }

        /* Animations */
        @keyframes shake {
            0% { transform: translateX(0); } 25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); } 75% { transform: translateX(-10px); }
            100% { transform: translateX(0); }
        }
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        .lift-up .question-part { 
            transform: translateY(-15px) scale(1.05) !important; 
            color: var(--text-color); 
        }
        .lift-up .operator { 
            transform: translateY(-17px) scale(1.05) !important; 
        }

        .streak-best {
            color: var(--quiet-color);
            border-top: 1px solid var(--border-soft);
            border-bottom: none;
            cursor: default;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                color-scheme: dark;
                --bg-color: #161616;
                --text-color: #ECEAE4;
                --surface-color: #202020;
                --border-color: #333;
                --accent-light: #1F2A25;
                --error-light: #2C2421;
                --overlay-color: rgba(22, 22, 22, 0.95);
                --muted-color: #A8A8A8;
                --operator-color: #A8A8A8;
                --quiet-color: #A8A8A8;
                --slider-color: #333;
                --button-ink: #161616;
                --knob-color: #ECEAE4;
                --accent-hover: #9BB0A6;
                --accent-active: #7B9187;
                --border-soft: #333;
                --border-strong: #333;
                --header-dot: #333;
            }
        }
        @media (min-width: 769px) {
            .question-part { font-size: 4.5rem; }
            .question-part.operator { font-size: 3.6rem; }
            .question-part.operator.text-op { font-size: 2.6rem; }
            .question-part.long-text { font-size: 2.8rem; }
            .question-part.empty-state { font-size: 1.5rem; }
            .input-container { width: 240px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <button class="menu-btn" onclick="toggleMenu()" aria-label="Settings">
                <svg class="menu-icon" viewBox="0 0 24 24">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
        </div>
        
        <h1>Étude</h1>
        
        <div class="header-right">
            <div class="streak-wrapper" id="streak-wrapper">
                <span class="streak-label">Streak</span>
                <div id="fractal-box" class="streak-container"></div>
                <div id="streak-digits" class="streak-digits" style="display: none;"></div>
                <div class="streak-dropdown" id="streak-dropdown">
                    <div class="streak-dropdown-header">Counter style</div>
                    <div class="streak-dropdown-item" data-mode="digits">Digits</div>
                    <div class="streak-dropdown-item" data-mode="fancy">Fancy</div>
                    <div id="streak-best" class="streak-dropdown-header streak-best" hidden></div>
                </div>
            </div>
        </div>
    </header>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal-overlay" onclick="closeMenu(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <div class="modal-title">Settings</div>
                <button class="close-btn" onclick="toggleMenu()">&times;</button>
            </div>
            
            <div id="toggles-container" class="toggles-list">
                <!-- JS Injected -->
            </div>

            <div style="margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--border-soft); text-align: center; font-size: 0.75rem; color: var(--quiet-color);">
                Version 0.5.0
            </div>
        </div>
    </div>

    <!-- Blitz Termination Modal -->
    <div id="blitz-terminate-modal" class="blitz-terminate-modal" onclick="closeBlitzTerminateModal(event)">
        <div class="blitz-terminate-content" onclick="event.stopPropagation()">
            <div class="blitz-terminate-title">Exit Blitz Mode?</div>
            <div class="blitz-terminate-message">The timer will stop and you'll return to normal practice.</div>
            <div class="blitz-terminate-buttons">
                <button class="blitz-terminate-btn" onclick="closeBlitzTerminateModal()">Cancel</button>
                <button class="blitz-terminate-btn confirm" onclick="terminateBlitzMode()">Terminate</button>
            </div>
        </div>
    </div>

    <main>
        <div class="blitz-timer-placeholder">
            <div id="blitz-timer" class="blitz-timer-container">
                <div class="blitz-grid">
                    <div class="blitz-square"></div>
                    <div class="blitz-square"></div>
                    <div class="blitz-square"></div>
                    <div class="blitz-square"></div>
                    <div class="blitz-square"></div>
                    <div class="blitz-square"></div>
                    <div class="blitz-square"></div>
                    <div class="blitz-square"></div>
                    <div class="blitz-square"></div>
                </div>
            </div>
        </div>

        <div id="question-box" class="question-container">
            <div id="question-content"></div>
            <div id="solution-display" class="solution-display"></div>
        </div>

        <div class="input-container">
            <input type="text" id="answer-input" inputmode="decimal" placeholder="" autocomplete="off" maxlength="12">
            <button id="mobile-enter-btn" class="mobile-enter-btn" aria-label="Submit answer">
                <svg viewBox="0 0 24 24">
                    <line x1="12" y1="19" x2="12" y2="5"></line>
                    <polyline points="5 12 12 5 19 12"></polyline>
                </svg>
            </button>
        </div>

        <div id="feedback" class="feedback-msg"></div>
    </main>

    <script>
        // --- Math Helpers ---
        const getRandomInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
        const pick = values => values[getRandomInt(0, values.length - 1)];
        const decimalAnswer = value => Number(value.toFixed(3));

        // --- Generators ---
        const generators = {
            add: {
                label: 'Addition',
                weight: 1.0,
                fn: (level = 1) => {
                    if (level > 1) {
                        let a, b;
                        if (level === 2) {
                            const half = Math.random() < 0.4;
                            a = getRandomInt(10, 99) + (half ? 0.5 : 0);
                            b = getRandomInt(10, 99) + (half ? 0.5 : 0);
                        } else if (level === 3) {
                            a = getRandomInt(100, 999); b = getRandomInt(10, 99);
                        } else if (level === 4) {
                            a = getRandomInt(100, 999); b = getRandomInt(100, 999);
                        } else {
                            a = getRandomInt(100, 9999) / 10; b = getRandomInt(100, 9999) / 10;
                        }
                        return { text: `${a} + ${b}`, answer: decimalAnswer(a + b) };
                    }
                    if (Math.random() > 0.7) {
                        let n1 = getRandomInt(1, 50) + 0.5;
                        let n2 = getRandomInt(1, 50) + 0.5;
                        return { text: `${n1} + ${n2}`, answer: n1 + n2 };
                    }
                    let n1 = getRandomInt(10, 99);
                    let n2 = getRandomInt(10, 99);
                    return { text: `${n1} + ${n2}`, answer: n1 + n2 };
                }
            },
            sub: {
                label: 'Subtraction',
                weight: 1.0,
                fn: (level = 1) => {
                    if (level > 1) {
                        let a, b;
                        if (level === 2) {
                            a = getRandomInt(100, 200); b = getRandomInt(10, a - 5);
                        } else if (level === 3) {
                            a = getRandomInt(10, 99) * 10 + getRandomInt(0, 8);
                            b = getRandomInt(1, 9) * 10 + getRandomInt(a % 10 + 1, 9);
                        } else if (level === 4) {
                            a = getRandomInt(101, 999); b = getRandomInt(100, a);
                        } else {
                            a = getRandomInt(1000, 9999); b = getRandomInt(100, a);
                            a /= 10; b /= 10;
                        }
                        return { text: `${a} - ${b}`, answer: decimalAnswer(a - b) };
                    }
                    let n1 = getRandomInt(20, 150);
                    let n2 = getRandomInt(5, n1 - 5);
                    return { text: `${n1} - ${n2}`, answer: n1 - n2 };
                }
            },
            mult: {
                label: 'Multiplication',
                weight: 1.0,
                fn: (level = 1) => {
                    if (level > 1) {
                        let a, b;
                        if (level === 2) { a = getRandomInt(12, 20); b = getRandomInt(3, 9); }
                        else if (level === 3) { a = getRandomInt(12, 99); b = getRandomInt(3, 9); }
                        else if (level === 4) { a = getRandomInt(11, 25); b = getRandomInt(11, 25); }
                        else if (Math.random() < 0.3) { a = getRandomInt(2, 9) / 10; b = getRandomInt(20, 99); }
                        else { a = getRandomInt(26, 99); b = getRandomInt(10, 12); }
                        return { text: `${a} × ${b}`, answer: decimalAnswer(a * b) };
                    }
                    let n1 = getRandomInt(3, 15);
                    let n2 = getRandomInt(3, 15);
                    return { text: `${n1} × ${n2}`, answer: n1 * n2 };
                }
            },
            div: {
                label: 'Division',
                weight: 1.0,
                fn: (level = 1) => {
                    if (level > 1) {
                        let divisor, quotient, dividend;
                        if (level === 2) { divisor = getRandomInt(3, 12); quotient = getRandomInt(12, 20); }
                        else if (level === 3) { divisor = getRandomInt(3, 9); quotient = getRandomInt(12, 99); }
                        else if (level === 4) { divisor = getRandomInt(11, 25); quotient = getRandomInt(11, 25); }
                        else {
                            divisor = pick([4, 8]); dividend = getRandomInt(100, 999);
                            return { text: `${dividend} ÷ ${divisor}`, answer: dividend / divisor };
                        }
                        return { text: `${divisor * quotient} ÷ ${divisor}`, answer: quotient };
                    }
                    let b = getRandomInt(3, 12);
                    let res = getRandomInt(4, 15);
                    return { text: `${b * res} ÷ ${b}`, answer: res };
                }
            },
            roots: {
                label: 'Exponents & Roots',
                weight: 0.6,
                fn: (level = 1) => {
                    if (level > 1) {
                        if (level === 2) {
                            const cube = Math.random() < 0.4;
                            const base = cube ? getRandomInt(2, 5) : getRandomInt(10, 20);
                            return { text: `${base}<sup>${cube ? 3 : 2}</sup>`, answer: base ** (cube ? 3 : 2) };
                        }
                        if (level === 3) {
                            if (Math.random() < 0.5) {
                                const root = getRandomInt(16, 25);
                                return { text: `&radic;${root * root}`, answer: root };
                            }
                            const power = getRandomInt(7, 10);
                            return { text: `2<sup>${power}</sup>`, answer: 2 ** power };
                        }
                        if (level === 4 && Math.random() < 0.4) {
                            const root = getRandomInt(2, 10);
                            return { text: `∛${root ** 3}`, answer: root };
                        }
                        const base = level === 4 ? getRandomInt(21, 35) : pick([45, 55, 65, 75, 85, 95, 46, 47, 48, 49, 51, 52, 53, 54]);
                        return { text: `${base}<sup>2</sup>`, answer: base * base };
                    }
                    if (Math.random() > 0.5) {
                        const base = getRandomInt(2, 9);
                        const power = base === 2 ? getRandomInt(2, 6) : getRandomInt(2, 3);
                        if (Math.random() > 0.8) {
                            const [negativeBase, exponent] = pick([[2, -1], [4, -1], [5, -1], [8, -1], [10, -1], [2, -2], [2, -3], [5, -2]]);
                            return { text: `${negativeBase}<sup>${exponent}</sup>`, answer: negativeBase ** exponent };
                        }
                        return { text: `${base}<sup>${power}</sup>`, answer: Math.pow(base, power) };
                    } else {
                        const root = getRandomInt(4, 15);
                        return { text: `&radic;${root * root}`, answer: root };
                    }
                }
            },
            pemdas: {
                label: 'Order of Operations',
                weight: 0.5,
                fn: (level = 1) => {
                    if (level > 1) {
                        const a = getRandomInt(10 * level, 20 * level);
                        const b = getRandomInt(2 * level, 5 * level);
                        const c = getRandomInt(2, level + 4);
                        return Math.random() < 0.5
                            ? { text: `(${a} + ${b}) × ${c}`, answer: (a + b) * c }
                            : { text: `${a} + ${b} × ${c}`, answer: a + b * c };
                    }
                    if (Math.random() > 0.5) {
                        let n1 = getRandomInt(2, 10), n2 = getRandomInt(1, 9), n3 = getRandomInt(2, 5);
                        return { text: `(${n1} + ${n2}) × ${n3}`, answer: (n1 + n2) * n3 };
                    }
                    let n1 = getRandomInt(5, 20), n2 = getRandomInt(2, 6), n3 = getRandomInt(2, 5);
                    return { text: `${n1} + ${n2} × ${n3}`, answer: n1 + (n2 * n3) };
                }
            },
            percent: {
                label: 'Percentages',
                weight: 1.0,
                fn: (level = 1) => {
                    if (level > 1) {
                        let p, base;
                        if (level === 2) {
                            p = pick([5, 10, 15, 20, 25, 50, 75]); base = getRandomInt(2, 40) * 10;
                        } else if (level === 3) {
                            p = pick([1, 5, 10, 15, 20, 25, 30, 40, 60, 75]); base = getRandomInt(10, 400);
                        } else if (level === 4) {
                            p = pick([12.5, 2.5, 35, 45]); base = getRandomInt(4, 80) * 5;
                        } else {
                            p = pick([2.5, 12.5, 15, 35, 45, 65, 85]);
                            // .2 steps keep even 2.5% and 12.5% answers within three decimals.
                            base = Math.random() < 0.5 ? getRandomInt(51, 499) / 5 : getRandomInt(100, 999);
                        }
                        return { text: `${p}% of ${base}`, answer: decimalAnswer(p * base / 100) };
                    }
                    if (Math.random() < 0.7) {
                        const percents = [10, 20, 25, 50, 75];
                        const p = percents[Math.floor(Math.random() * percents.length)];
                        const base = getRandomInt(2, 40) * 10;
                        return { text: `${p}% of ${base}`, answer: (p/100)*base };
                    }
                    const p = [1, 5, 15][Math.floor(Math.random() * 3)];
                    const base = getRandomInt(10, 200);
                    return { text: `${p}% of ${base}`, answer: (p/100)*base };
                }
            },
            fraction: {
                label: 'Fractions',
                weight: 0.7,
                fn: (level = 1) => {
                    if (level > 1) {
                        const denoms = level === 2 ? [4, 5, 8, 10] : level === 3 ? [8, 20, 25, 50] : [40, 125, 200, 250];
                        const d = pick(denoms), n = getRandomInt(d + 1, d * level);
                        if (level < 5) return { text: `${n}/${d}`, answer: n / d };
                        const d2 = pick([8, 20, 125]), n2 = getRandomInt(10, d2 * 2);
                        return { text: `${n}/${d} + ${n2}/${d2}`, answer: decimalAnswer(n / d + n2 / d2) };
                    }
                    // Restricted denominators for easy decimal input (2, 4, 5, 8, 10, 20, 25, 50)
                    const cleanDenoms = [2, 4, 5, 8, 10, 20, 25, 50];

                    if (Math.random() < 0.5) {
                        // Addition: 1/2 + 1/4
                        const d1 = [2,4,5,10][getRandomInt(0, 3)];
                        const d2 = [2,4,5,10][getRandomInt(0, 3)];
                        const n2 = getRandomInt(1, 3);
                        return { text: `1/${d1} + ${n2}/${d2}`, answer: (1/d1) + (n2/d2) };
                    }
                    
                    // Reduction/Simplification -> Answer as Decimal
                    const d = cleanDenoms[getRandomInt(0, cleanDenoms.length - 1)];
                    const factor = getRandomInt(2, 5);
                    const n = getRandomInt(1, d-1);
                    
                    // Display as unreduced: e.g. 6/8 (which is 0.75)
                    return { text: `${n*factor}/${d*factor}`, answer: n/d };
                }
            }
        };

        // --- Config & Persistence ---
        const defaultConfig = {
            ...Object.keys(generators).reduce((acc, key) => ({...acc, [key]: key !== 'fraction' && key !== 'pemdas'}), {}),
            fraction: false, // Disabled but kept in code for reactivation
            pemdas: false, // Disabled but kept in code for reactivation
            blitzMode: false,
            autoAccept: false,
            streakMode: 'digits' // Default to digits mode
        };
        function readStored(key, fallback) {
            try {
                const value = JSON.parse(localStorage.getItem(key));
                return value === null ? fallback : value;
            } catch (_) { return fallback; }
        }

        function writeStored(key, value) {
            try { localStorage.setItem(key, JSON.stringify(value)); } catch (_) {}
        }

        const storedConfig = readStored('etude_config', {});
        let activeConfig = { ...defaultConfig, ...(storedConfig && typeof storedConfig === 'object' ? storedConfig : {}) };
        // Category switches intentionally remain unavailable.
        Object.keys(generators).forEach(key => {
            activeConfig[key] = key !== 'fraction' && key !== 'pemdas';
        });
        const storedLevels = readStored('etude_levels', {});
        const storedStats = readStored('etude_stats', {});
        const levels = {}, stats = {};
        Object.keys(generators).forEach(key => {
            const level = storedLevels && storedLevels[key];
            levels[key] = Number.isInteger(level) ? Math.max(1, Math.min(5, level)) : 1;
            const saved = storedStats && storedStats[key];
            stats[key] = {
                recent: Array.isArray(saved?.recent) ? saved.recent.filter(x => typeof x === 'boolean').slice(-10) : [],
                run: Array.isArray(saved?.run) ? saved.run.filter(x => typeof x === 'boolean').slice(-4) : [],
                correctRun: Number.isInteger(saved?.correctRun) ? Math.max(0, Math.min(4, saved.correctRun)) : 0
            };
        });
        const storedCount = key => {
            const value = readStored(key, 0);
            return Number.isSafeInteger(value) && value > 0 ? value : 0;
        };

        // --- State Management ---
        const state = {
            currentQuestion: null,
            streak: storedCount('etude_streak'),
            best: Math.max(storedCount('etude_best'), storedCount('etude_streak')),
            questionNumber: 0,
            reviewQueue: [],
            blitzMode: activeConfig.blitzMode || false,
            blitzActive: false,
            blitzTimeLeft: 9,
            blitzInterval: null,
            blitzStartTimeout: null,
            blitzStartRemaining: null,
            blitzStartDeadline: null,
            blitzRemainingMs: 9000,
            blitzDeadline: null,
            resolutionTimeout: null,
            solutionTimeout: null,
            flashTimeout: null,
            resolving: false,
            transitioning: false
        };

        const els = {
            input: document.getElementById('answer-input'),
            fractalBox: document.getElementById('fractal-box'),
            streakWrapper: document.getElementById('streak-wrapper'),
            streakDigits: document.getElementById('streak-digits'),
            streakDropdown: document.getElementById('streak-dropdown'),
            streakBest: document.getElementById('streak-best'),
            feedback: document.getElementById('feedback'),
            container: document.getElementById('question-box'),
            questionContent: document.getElementById('question-content'),
            modal: document.getElementById('settings-modal'),
            toggles: document.getElementById('toggles-container'),
            blitzTimer: document.getElementById('blitz-timer'),
            blitzTerminateModal: document.getElementById('blitz-terminate-modal'),
            mobileEnterBtn: document.getElementById('mobile-enter-btn'),
            solutionDisplay: document.getElementById('solution-display')
        };

        // --- UI: Menu Logic ---
        function initMenu() {
            els.toggles.innerHTML = '';

            // Add blitz mode toggle
            const blitzRow = document.createElement('div');
            blitzRow.className = 'toggle-item';
            blitzRow.innerHTML = `
                <span class="toggle-label">Blitz Mode (9s)</span>
                <label class="switch" onmousedown="event.preventDefault()">
                    <input type="checkbox" id="blitz-toggle" ${activeConfig.blitzMode ? 'checked' : ''} onchange="updateConfig('blitzMode', this.checked)">
                    <span class="slider"></span>
                </label>
            `;
            els.toggles.appendChild(blitzRow);

            // Add auto accept toggle
            const autoAcceptRow = document.createElement('div');
            autoAcceptRow.className = 'toggle-item';
            autoAcceptRow.innerHTML = `
                <span class="toggle-label">Automatically accept correct answers</span>
                <label class="switch" onmousedown="event.preventDefault()">
                    <input type="checkbox" id="auto-accept-toggle" ${activeConfig.autoAccept ? 'checked' : ''} onchange="updateConfig('autoAccept', this.checked)">
                    <span class="slider"></span>
                </label>
            `;
            els.toggles.appendChild(autoAcceptRow);
        }

        window.updateConfig = (key, isChecked) => {
            activeConfig[key] = isChecked;
            if (key === 'blitzMode') {
                state.blitzMode = isChecked;
            }
            writeStored('etude_config', activeConfig);
            if (key !== 'autoAccept') {
                nextQuestion();
            }
        };


        function modalIsOpen() {
            return els.modal.classList.contains('open') || els.blitzTerminateModal.classList.contains('open');
        }

        function refocusInput() {
            if (!modalIsOpen() && !els.input.disabled) els.input.focus();
        }

        window.toggleMenu = () => {
            const isOpen = els.modal.classList.toggle('open');
            if (isOpen) {
                pauseBlitzTimer();
                els.input.blur();
            } else {
                resumeBlitzTimer();
                setTimeout(refocusInput, 300);
            }
        };

        window.closeMenu = (e) => {
            if (e.target === els.modal) {
                els.modal.classList.remove('open');
                resumeBlitzTimer();
                setTimeout(refocusInput, 300);
            }
        };

        // --- Core Game Logic ---
        function recordAttempt(correct) {
            const key = state.currentQuestion.category;
            const category = stats[key];
            category.recent.push(correct);
            category.recent = category.recent.slice(-10);
            category.run.push(correct);
            category.run = category.run.slice(-4);
            category.correctRun = correct ? category.correctRun + 1 : 0;
            let nextLevel = levels[key];
            if (category.correctRun >= 5) nextLevel++;
            else if (category.run.filter(result => !result).length >= 2) nextLevel--;
            nextLevel = Math.max(1, Math.min(5, nextLevel));
            if (nextLevel !== levels[key]) {
                levels[key] = nextLevel;
                category.run = [];
                category.correctRun = 0;
            }
            writeStored('etude_levels', levels);
            writeStored('etude_stats', stats);
            if (!correct) {
                const question = state.currentQuestion;
                state.reviewQueue = state.reviewQueue.filter(item => item.question.text !== question.text || item.question.category !== key);
                if (state.reviewQueue.length >= 10) state.reviewQueue.shift();
                state.reviewQueue.push({ question: { ...question }, due: state.questionNumber + getRandomInt(3, 5) + 1 });
            }
        }

        function generateQuestion() {
            const pool = Object.keys(generators).filter(key => activeConfig[key]).map(key => {
                const recent = stats[key].recent;
                const errorRate = recent.length ? recent.filter(result => !result).length / recent.length : 0;
                return { key, weight: generators[key].weight * (1 + errorRate) };
            });
            const total = pool.reduce((sum, item) => sum + item.weight, 0);
            if (!total) return null;
            let draw = Math.random() * total;
            const selected = pool.find(item => (draw -= item.weight) < 0) || pool[pool.length - 1];
            return { ...generators[selected.key].fn(levels[selected.key]), category: selected.key };
        }

        function chooseQuestion() {
            state.questionNumber++;
            state.reviewQueue = state.reviewQueue.filter(item => activeConfig[item.question.category]);
            const previousText = state.currentQuestion?.text;
            const reviewIndex = state.reviewQueue.findIndex(item => item.due <= state.questionNumber && item.question.text !== previousText);
            if (reviewIndex >= 0) return state.reviewQueue.splice(reviewIndex, 1)[0].question;
            let question;
            for (let attempt = 0; attempt <= 10; attempt++) {
                question = generateQuestion();
                if (!question || question.text !== previousText) return question;
            }
            // A different enabled category guarantees different notation if random retries repeat.
            const alternate = Object.keys(generators).find(key => activeConfig[key] && key !== question.category);
            return alternate ? { ...generators[alternate].fn(levels[alternate]), category: alternate } : null;
        }

        function processMathText(text) {
            return text.replace(/&radic;(\d+)/g, (_, number) =>
                `<span class="katex-inline" data-root="${number}">√${number}</span>`);
        }

        function renderMath() {
            if (!window.katex || typeof window.katex.render !== 'function') return;
            els.questionContent.querySelectorAll('.katex-inline').forEach(el => {
                const fallback = `√${el.dataset.root}`;
                try {
                    window.katex.render(`\\sqrt{${el.dataset.root}}`, el, { throwOnError: true, displayMode: false });
                } catch (_) { el.textContent = fallback; }
            });
        }

        function renderQuestion(data) {
            if (!data) {
                els.questionContent.innerHTML = `<span class="question-part empty-state">Select a Mode</span>`;
                return;
            }
            const text = data.text;
            const processedText = processMathText(text);
            if (text.includes('<') || text.includes('&') || text.length > 15) {
                const isLong = text.length > 10;
                els.questionContent.innerHTML = `<span class="question-part ${isLong ? 'long-text' : ''}">${processedText}</span>`;
            } else {
                const parts = processedText.split(' ');
                if (parts.length === 3) {
                    const isTextOp = isNaN(parts[1]) && parts[1].length > 1;
                    const opClass = isTextOp ? 'operator text-op' : 'operator';
                    els.questionContent.innerHTML = `
                        <span class="question-part">${parts[0]}</span>
                        <span class="question-part ${opClass}">${parts[1]}</span>
                        <span class="question-part">${parts[2]}</span>
                    `;
                } else {
                    els.questionContent.innerHTML = `<span class="question-part">${processedText}</span>`;
                }
            }
            renderMath();
        }

        // Blitz keeps the exact remaining countdown and start delay while a modal is open.
        function scheduleBlitzStart() {
            if (modalIsOpen() || state.resolving || !state.blitzMode || !state.currentQuestion || state.blitzStartRemaining === null) return;
            state.blitzStartDeadline = performance.now() + state.blitzStartRemaining;
            state.blitzStartTimeout = setTimeout(() => {
                state.blitzStartTimeout = null;
                state.blitzStartRemaining = null;
                state.blitzStartDeadline = null;
                startBlitzTimer();
            }, state.blitzStartRemaining);
        }

        function startBlitzTimer() {
            if (!state.blitzMode || state.resolving || modalIsOpen() || !state.currentQuestion) return;
            state.blitzActive = true;
            state.blitzTimeLeft = 9;
            state.blitzRemainingMs = 9000;
            els.blitzTimer.classList.add('active');
            resetBlitzSquares();
            resumeBlitzTimer();
        }

        function tickBlitzTimer() {
            state.blitzInterval = null;
            if (state.resolving || modalIsOpen() || !state.blitzActive) return;
            state.blitzRemainingMs = Math.max(0, state.blitzDeadline - performance.now());
            state.blitzTimeLeft = Math.ceil(state.blitzRemainingMs / 1000);
            updateBlitzSquares();
            if (state.blitzRemainingMs <= 0) {
                if (state.currentQuestion && !state.resolving) handleFailure(state.currentQuestion.answer);
            } else {
                const untilNextSquare = state.blitzRemainingMs - (state.blitzTimeLeft - 1) * 1000;
                state.blitzInterval = setTimeout(tickBlitzTimer, Math.max(1, untilNextSquare));
            }
        }

        function pauseBlitzTimer() {
            if (state.blitzStartTimeout !== null) {
                state.blitzStartRemaining = Math.max(0, state.blitzStartDeadline - performance.now());
                clearTimeout(state.blitzStartTimeout);
                state.blitzStartTimeout = null;
                state.blitzStartDeadline = null;
            }
            if (state.blitzActive && state.blitzDeadline !== null) {
                state.blitzRemainingMs = Math.max(0, state.blitzDeadline - performance.now());
                clearTimeout(state.blitzInterval);
                state.blitzInterval = null;
                state.blitzDeadline = null;
            }
        }

        function resumeBlitzTimer() {
            if (modalIsOpen() || state.resolving || !state.blitzMode) return;
            if (state.blitzActive && state.blitzInterval === null) {
                state.blitzDeadline = performance.now() + state.blitzRemainingMs;
                tickBlitzTimer();
            } else if (state.blitzStartTimeout === null) {
                scheduleBlitzStart();
            }
        }

        els.blitzTimer.addEventListener('click', () => {
            if (state.blitzActive && !state.resolving) {
                els.blitzTerminateModal.classList.add('open');
                pauseBlitzTimer();
                els.input.blur();
            }
        });

        window.closeBlitzTerminateModal = (e) => {
            if (!e || e.target === els.blitzTerminateModal) {
                els.blitzTerminateModal.classList.remove('open');
                resumeBlitzTimer();
                refocusInput();
            }
        };

        window.terminateBlitzMode = () => {
            stopBlitzTimer();
            state.blitzMode = false;
            activeConfig.blitzMode = false;
            writeStored('etude_config', activeConfig);
            const blitzToggle = document.getElementById('blitz-toggle');
            if (blitzToggle) blitzToggle.checked = false;
            els.blitzTerminateModal.classList.remove('open');
            nextQuestion();
        };

        function stopBlitzTimer() {
            clearTimeout(state.blitzInterval);
            clearTimeout(state.blitzStartTimeout);
            state.blitzInterval = null;
            state.blitzStartTimeout = null;
            state.blitzStartRemaining = null;
            state.blitzStartDeadline = null;
            state.blitzDeadline = null;
            state.blitzActive = false;
            els.blitzTimer.classList.remove('active');
        }

        function resetBlitzSquares() {
            const squares = els.blitzTimer.querySelectorAll('.blitz-square');
            squares.forEach(sq => sq.classList.remove('faded'));
        }

        function updateBlitzSquares() {
            // Clockwise perimeter then inward: [0,1,2,5,8,7,6,3] then [4] center
            const fadeIndex = 9 - state.blitzTimeLeft;
            const squares = els.blitzTimer.querySelectorAll('.blitz-square');
            const fadeOrder = [0, 1, 2, 5, 8, 7, 6, 3, 4]; // Clockwise perimeter then center

            squares.forEach((square, index) => {
                square.classList.toggle('faded', fadeOrder.indexOf(index) < fadeIndex);
            });
        }

        function nextQuestion(preserveFocus = false) {
            stopBlitzTimer();
            clearTimeout(state.resolutionTimeout);
            clearTimeout(state.solutionTimeout);
            clearTimeout(state.flashTimeout);
            state.resolving = false;
            state.transitioning = false;
            state.currentQuestion = chooseQuestion();
            renderQuestion(state.currentQuestion);

            els.input.value = '';
            els.feedback.style.opacity = '0';
            els.container.classList.remove('lift-up', 'shake');
            document.body.classList.remove('success-flash', 'error-flash');

            // Clear solution display (it should already be faded out)
            els.solutionDisplay.classList.remove('visible');
            els.solutionDisplay.textContent = '';

            // Hide mobile enter button
            updateMobileEnterButton();

            if (state.currentQuestion) {
                els.input.disabled = false;
                if (!modalIsOpen()) {
                    if (preserveFocus) {
                        // Maintain focus if it was already focused (for mobile keyboard)
                        setTimeout(() => {
                            if (!modalIsOpen() && document.activeElement !== els.input) {
                                els.input.focus();
                            }
                        }, 50);
                    } else {
                        els.input.focus();
                    }
                }
                if (state.blitzMode) {
                    state.blitzStartRemaining = 1000;
                    scheduleBlitzStart();
                }
            } else {
                els.input.disabled = true;
            }
        }

        function updateMobileEnterButton() {
            if (!els.mobileEnterBtn) return;
            const val = els.input.value.trim();
            const hasValue = val !== '' && val !== '.' && val !== '-';
            
            if (hasValue) {
                els.mobileEnterBtn.classList.add('visible');
            } else {
                els.mobileEnterBtn.classList.remove('visible');
            }
        }

        function checkInput() {
            if (!state.currentQuestion) return;
            
            // Prevent input during transition
            if (state.resolving || state.transitioning || modalIsOpen()) {
                els.input.value = '';
                return;
            }

            let val = els.input.value;
            const cleanVal = val.replace(/[^0-9.,-]/g, '');
            if (val !== cleanVal) { els.input.value = cleanVal; val = cleanVal; }
            
            // Update mobile enter button visibility
            updateMobileEnterButton();
            
            if (val === '' || val === '.' || val === '-') return;

            let numVal = parseFloat(val.replace(',', '.'));

            if (isNaN(numVal)) return;

            const correctVal = state.currentQuestion.answer;
            if (Math.abs(numVal - correctVal) < 0.001) {
                if (activeConfig.autoAccept) {
                    handleSuccess();
                }
            }
        }

        function handleSuccess() {
            if (state.resolving || !state.currentQuestion) return;
            state.resolving = true;
            state.transitioning = true;
            stopBlitzTimer();
            recordAttempt(true);
            state.streak++;
            state.best = Math.max(state.best, state.streak);
            renderStreak();
            document.body.classList.add('success-flash');
            els.container.classList.add('lift-up');
            // Keep input focused to prevent mobile keyboard from closing
            els.input.focus();
            state.resolutionTimeout = setTimeout(() => {
                nextQuestion(true); // Pass flag to preserve focus
            }, 200);
        }

        function handleFailure(correctVal) {
            if (state.resolving || !state.currentQuestion) return;
            state.resolving = true;
            state.transitioning = true;
            stopBlitzTimer();
            recordAttempt(false);
            state.streak = 0;
            renderStreak();
            
            els.container.classList.add('shake');
            document.body.classList.add('error-flash');
            state.flashTimeout = setTimeout(() => {
                els.container.classList.remove('shake');
                document.body.classList.remove('error-flash');
            }, 400);

            const displayVal = Number(correctVal.toFixed(6)).toString();
            els.feedback.style.opacity = '0';
            
            // Show solution below the equation
            els.solutionDisplay.textContent = `= ${displayVal}`;
            state.solutionTimeout = setTimeout(() => {
                els.solutionDisplay.classList.add('visible');
            }, 100);
            
            els.input.value = '';
            // Keep input focused to prevent mobile keyboard from closing
            els.input.focus();
            
            // Show solution for ~1.5 seconds, then fade out gracefully
            state.resolutionTimeout = setTimeout(() => {
                els.solutionDisplay.classList.remove('visible');
                // Show new problem immediately as solution starts fading
                nextQuestion(true); // Pass flag to preserve focus
            }, 1500);
        }

        // --- Fractal Render ---
        function renderStreak() {
            const s = state.streak;
            writeStored('etude_streak', s);
            writeStored('etude_best', state.best);
            els.streakBest.hidden = state.best <= 0;
            els.streakBest.textContent = state.best > 0 ? `Best ${state.best}` : '';
            
            // Toggle Visibility of Entire Wrapper
            if (s > 0) {
                els.streakWrapper.classList.add('visible');
            } else {
                els.streakWrapper.classList.remove('visible');
            }

            const mode = activeConfig.streakMode || 'digits';
            
            if (mode === 'digits') {
                // Show digits, hide fractal
                els.fractalBox.style.display = 'none';
                els.streakDigits.style.display = 'flex';
                els.streakDigits.textContent = s > 0 ? s.toString() : '';
            } else {
                // Show fractal, hide digits
                els.fractalBox.style.display = 'flex';
                els.streakDigits.style.display = 'none';
                els.fractalBox.innerHTML = '';
                if (s === 0) return;
                let level = 1;
                while (Math.pow(9, level) < s) level++;
                els.fractalBox.innerHTML = generateFractalHTML(s, level);
            }
        }

        // Streak Dropdown Functions
        function updateStreakDropdown() {
            const mode = activeConfig.streakMode || 'digits';
            const items = els.streakDropdown.querySelectorAll('.streak-dropdown-item');
            items.forEach(item => {
                if (item.dataset.mode === mode) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
        }

        function toggleStreakDropdown() {
            els.streakDropdown.classList.toggle('open');
        }

        function closeStreakDropdown() {
            els.streakDropdown.classList.remove('open');
        }

        function setStreakMode(mode) {
            activeConfig.streakMode = mode;
            writeStored('etude_config', activeConfig);
            updateStreakDropdown();
            renderStreak();
            closeStreakDropdown();
        }

        // Streak wrapper click handler
        els.streakWrapper.addEventListener('click', (e) => {
            if (e.target.closest('.streak-dropdown-item')) {
                const mode = e.target.closest('.streak-dropdown-item').dataset.mode;
                setStreakMode(mode);
            } else if (!e.target.closest('.streak-dropdown')) {
                toggleStreakDropdown();
            }
        });

        // Close dropdown when clicking outside
        document.addEventListener('click', (e) => {
            if (!els.streakWrapper.contains(e.target)) {
                closeStreakDropdown();
            }
        });

        function generateFractalHTML(count, level) {
            if (level === 0) return '<div class="f-item f-atom"></div>';
            const subCap = Math.pow(9, level - 1);
            let html = '<div class="f-grid">';
            for (let i = 0; i < 9; i++) {
                if (count >= subCap) {
                    html += '<div class="f-item f-full"></div>';
                    count -= subCap;
                } else if (count > 0) {
                    html += generateFractalHTML(count, level - 1);
                    count = 0;
                } else { html += '<div></div>'; }
            }
            html += '</div>';
            return html;
        }

        // Prevent scroll on iOS when keyboard opens
        els.input.addEventListener('touchstart', (e) => {
            e.preventDefault();
            // Move input far off screen, focus it, then move it back
            // This tricks iOS into not scrolling
            els.input.style.transform = 'translateY(-10000px)';
            els.input.focus();
            setTimeout(() => {
                els.input.style.transform = 'none';
            }, 100);
        });

        // Handle Enter/Submit action
        function handleEnterSubmit() {
            if (!state.currentQuestion || state.resolving || state.transitioning || modalIsOpen()) return;

            let val = els.input.value.replace(',', '.');
            let numVal = parseFloat(val);

            if (isNaN(numVal)) return;

            // Hide mobile enter button immediately when answer is submitted
            if (els.mobileEnterBtn) {
                els.mobileEnterBtn.classList.remove('visible');
            }

            els.input.value = '';

            const correct = state.currentQuestion.answer;
            if (Math.abs(numVal - correct) < 0.001) {
                // Correct answer
                handleSuccess();
            } else {
                // Wrong answer
                handleFailure(correct);
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (els.blitzTerminateModal.classList.contains('open')) {
                    closeBlitzTerminateModal();
                } else if (els.modal.classList.contains('open')) {
                    toggleMenu();
                } else if (els.streakDropdown.classList.contains('open')) {
                    closeStreakDropdown();
                }
                refocusInput();
                e.preventDefault();
                return;
            }
            if (window.matchMedia('(min-width: 769px)').matches && !modalIsOpen() &&
                !e.ctrlKey && !e.metaKey && !e.altKey && !e.isComposing &&
                document.activeElement !== els.input && !els.input.disabled &&
                (/^[0-9.,-]$/.test(e.key) || e.key === 'Backspace')) {
                els.input.focus();
                e.preventDefault();
                if (state.resolving || state.transitioning) return;
                const start = els.input.selectionStart ?? els.input.value.length;
                const end = els.input.selectionEnd ?? start;
                if (e.key === 'Backspace') {
                    els.input.setRangeText('', start === end ? Math.max(0, start - 1) : start, end, 'end');
                } else if (els.input.value.length - (end - start) < els.input.maxLength) {
                    els.input.setRangeText(e.key, start, end, 'end');
                }
                checkInput();
            }
        });

        // --- Initialization ---
        els.input.addEventListener('input', checkInput);
        els.input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                handleEnterSubmit();
            }
        });

        // Mobile enter button click handler
        if (els.mobileEnterBtn) {
            els.mobileEnterBtn.addEventListener('click', handleEnterSubmit);
        }


        window.onload = () => {
            initMenu();
            updateStreakDropdown();
            renderStreak();
            nextQuestion();
            setTimeout(() => {
                refocusInput();
            }, 100);
            document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });
        };
        if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
    </script>
</body>
